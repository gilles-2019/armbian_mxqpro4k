# Configuration SEI610 pour S905X3
BOARD_NAME="SEI610"
BOARDFAMILY="meson64"
# BOARDFAMILY="meson-sm1"
BOARD_MAINTAINER="community"
ARCH="arm64"
KERNEL_TARGET="current,edge"
FULL_DESKTOP="no"
BOOT_LOGO="yes"
# C'est ici que l'on définit la cible U-Boot pour le S905X3
UBOOT_TARGET_MAP="odroid-c4"
# Forcer l'utilisation de la version la plus récente supportée par Armbian
UBOOT_BRANCH="v2023.07"
UBOOT_TAG="v2023.07"

# Forcer explicitement le répertoire des patches Armbian à utiliser
UBOOTPATCHDIR="v2023.07"
DEFAULT_FDT="amlogic/meson-sm1-sei610.dtb"

